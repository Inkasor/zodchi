name: Проверка

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Тесты и линтеры
        run: npm test
      - name: Генераторы не оставляют скрытый diff
        run: |
          npm --prefix WorkflowPlatform run packages:generate
          git diff --exit-code -- WorkflowPlatform/contracts/quality-contracts.xml WorkflowPlatform/packages/catalog.json WorkflowPlatform/packages/example/generated
      - name: Проверка релизной сборки
        run: |
          node scripts/build-release.mjs --output "${{ runner.temp }}/Zodchi" --stage-root "${{ runner.temp }}"
          node "${{ runner.temp }}/Zodchi/tools/release-lint.mjs" "${{ runner.temp }}/Zodchi"
          npm --prefix "${{ runner.temp }}/Zodchi" test
      - name: Install hook run update rollback acceptance
        run: node tools/platform-acceptance.mjs --work "${{ runner.temp }}/platform-acceptance" --out "${{ runner.temp }}/platform-acceptance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/platform-acceptance.json
