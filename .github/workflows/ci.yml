name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job name and matrix give the check names the protection of main requires: test (<os>).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository checks (workflows, agents, JSON, roles, publish guard)
        run: node scripts/check.mjs
      - name: Build the gateway (release binaries, the candidate the end-to-end suite runs)
        run: cargo build --release --locked --manifest-path gateway/Cargo.toml
      - name: End-to-end suite of the gateway (fake Codex, no model spend)
        run: node scripts/e2e.mjs --no-build --out "$RUNNER_TEMP/e2e-traces"
      - name: Keep the traces of the end-to-end suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-traces
          if-no-files-found: ignore
      - name: Installer round trip in a scratch home
        env:
          ZODCHI_HOME: ${{ runner.temp }}/zodchi-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          node install/install.mjs --no-build --no-plugins
          test -f "$ZODCHI_HOME/models.json"
          test -f "$ZODCHI_HOME/roles/code-review.json"
          node install/install.mjs --uninstall --no-plugins
          test ! -f "$ZODCHI_HOME/roles/code-review.json"
