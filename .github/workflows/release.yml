name: Публичный релиз

# Публикует только этот workflow. Локальный `gh release create` до 0.6.0 обгонял tag build:
# ассеты загружал человек, workflow падал на уже существующем релизе, и ни один опубликованный
# ассет не был артефактом CI. Поэтому существующий релиз здесь — отказ, а не повод дополнить.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ARCHIVE_NAME: Zodchi-${{ github.ref_name }}.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `gh release view` завершается ненулевым кодом, когда релиза нет, а это и есть успешный случай.
      # Поэтому поведение по коду возврата задаётся явно: иначе проверка сработала бы наоборот.
      - name: Релиз с этим тегом не должен существовать
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "${{ github.ref_name }}" --json tagName 2>$null | Out-Null
          $found = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($found) { throw "RELEASE_PREEXISTED: ${{ github.ref_name }} already exists and was not published by this workflow." }

      - name: Проверка версии и тесты
        shell: pwsh
        run: |
          $product = Get-Content -Raw product.json | ConvertFrom-Json
          if ("v$($product.version)" -ne "${{ github.ref_name }}") { throw 'Tag does not match product.json version.' }
          npm test

      - name: Сборка архива, контрольных сумм и манифеста
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'Zodchi'
          node scripts/build-release.mjs --output $out --stage-root $env:RUNNER_TEMP
          node "$out\tools\release-lint.mjs" $out
          $archive = Join-Path $PWD $env:ARCHIVE_NAME
          node scripts/build-release-archive.mjs --root $out --out $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE_NAME" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
          node scripts/build-release-manifest.mjs --archive $archive --checksums SHA256SUMS.txt --tag "${{ github.ref_name }}" --commit "${{ github.sha }}" --release-root $out --out zodchi-release-manifest.json --workflow-run "${{ github.run_id }}" --repository "${{ github.repository }}"

      - name: Provenance опубликованного архива
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Создание draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ARCHIVE_NAME" SHA256SUMS.txt zodchi-release-manifest.json --title "Zodchi ${{ github.ref_name }}" --draft --generate-notes

  draft_smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Draft уже хранит окончательные GitHub assets, но ещё не доступен пользователю. Проверяем их
      # checksum, Sigstore provenance, установку и полный workflow до публичного перехода.
      - name: Smoke draft-ассетов
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-smoke.mjs --repository "${{ github.repository }}" --tag "${{ github.ref_name }}" --allow-draft --work "${{ runner.temp }}/release-smoke" --out release-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-draft-smoke-${{ github.ref_name }}-${{ matrix.os }}
          path: release-smoke.json

  publish:
    needs: draft_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Публикация только после green draft smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isPrerelease = "${{ github.ref_name }}".Substring(1).Contains('-')
          $prerelease = $isPrerelease.ToString().ToLowerInvariant()
          $arguments = @('release', 'edit', '${{ github.ref_name }}', '--draft=false', "--prerelease=$prerelease")
          if (-not $isPrerelease) { $arguments += '--latest' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'RELEASE_PUBLISH_FAILED' }

  post_publish_smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke публично скачиваемых ассетов
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-smoke.mjs --repository "${{ github.repository }}" --tag "${{ github.ref_name }}" --work "${{ runner.temp }}/release-smoke" --out release-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-post-publish-smoke-${{ github.ref_name }}-${{ matrix.os }}
          path: release-smoke.json

  rollback_failed_publication:
    needs: post_publish_smoke
    if: ${{ always() && needs.post_publish_smoke.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Вернуть не прошедший публичный релиз в draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "${{ github.ref_name }}" --draft=true
            if ($LASTEXITCODE -ne 0) { throw 'RELEASE_ROLLBACK_TO_DRAFT_FAILED' }
          } else {
            $global:LASTEXITCODE = 0
            Write-Host 'No GitHub Release was created; publication rollback is unnecessary.'
          }
