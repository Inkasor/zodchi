name: Публичный релиз

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Проверка версии и тесты
        shell: pwsh
        run: |
          $product = Get-Content -Raw product.json | ConvertFrom-Json
          if ("v$($product.version)" -ne "${{ github.ref_name }}") { throw 'Tag does not match product.json version.' }
          npm.cmd test
      - name: Сборка архива
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'release'
          $out = Join-Path $root 'Zodchi'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          .\scripts\build-release.ps1 -Output $out -StageRoot $env:RUNNER_TEMP
          $archive = Join-Path $PWD "Zodchi-${{ github.ref_name }}-windows.zip"
          Compress-Archive -LiteralPath $out -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Публикация GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Zodchi-${{ github.ref_name }}-windows.zip" SHA256SUMS.txt --title "Zodchi ${{ github.ref_name }}" --prerelease --generate-notes
