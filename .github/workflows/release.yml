name: Публичный релиз

# Публикует только этот workflow. Локальный `gh release create` до 0.6.0 обгонял tag build:
# ассеты загружал человек, workflow падал на уже существующем релизе, и ни один опубликованный
# ассет не был артефактом CI. Поэтому существующий релиз здесь — отказ, а не повод дополнить.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ARCHIVE_NAME: Zodchi-${{ github.ref_name }}-windows.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `gh release view` завершается ненулевым кодом, когда релиза нет, а это и есть успешный случай.
      # Поэтому поведение по коду возврата задаётся явно: иначе проверка сработала бы наоборот.
      - name: Релиз с этим тегом не должен существовать
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "${{ github.ref_name }}" --json tagName 2>$null | Out-Null
          $found = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($found) { throw "RELEASE_PREEXISTED: ${{ github.ref_name }} already exists and was not published by this workflow." }

      - name: Проверка версии и тесты
        shell: pwsh
        run: |
          $product = Get-Content -Raw product.json | ConvertFrom-Json
          if ("v$($product.version)" -ne "${{ github.ref_name }}") { throw 'Tag does not match product.json version.' }
          npm.cmd test

      - name: Сборка архива, контрольных сумм и манифеста
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'Zodchi'
          .\scripts\build-release.ps1 -Output $out -StageRoot $env:RUNNER_TEMP
          node "$out\tools\release-lint.mjs" $out
          $archive = Join-Path $PWD $env:ARCHIVE_NAME
          Compress-Archive -LiteralPath $out -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE_NAME" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
          node scripts/build-release-manifest.mjs --archive $archive --checksums SHA256SUMS.txt --tag "${{ github.ref_name }}" --commit "${{ github.sha }}" --release-root $out --out zodchi-release-manifest.json --workflow-run "${{ github.run_id }}" --repository "${{ github.repository }}"

      - name: Provenance опубликованного архива
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Публикация GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ARCHIVE_NAME" SHA256SUMS.txt zodchi-release-manifest.json --title "Zodchi ${{ github.ref_name }}" --prerelease --generate-notes

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Скачивает то, что реально отдаёт GitHub, а не собственный build output: расхождение между
      # проверенной сборкой и опубликованным ассетом — единственное, чего локальная проверка не видит.
      - name: Smoke опубликованных ассетов
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-smoke.mjs --repository "${{ github.repository }}" --tag "${{ github.ref_name }}" --work (Join-Path $env:RUNNER_TEMP 'release-smoke') --out release-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ github.ref_name }}
          path: release-smoke.json
