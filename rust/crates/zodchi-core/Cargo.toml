[package]
name = "zodchi-core"
description = "Jobs, roles, the Codex app-server protocol and the subscription pool of the zodchi gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
time.workspace = true
rand.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tungstenite = { version = "0.30", features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
