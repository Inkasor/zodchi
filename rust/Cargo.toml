[workspace]
resolver = "2"
members = [
    "crates/zodchi-core",
    "crates/zodchi-cli",
    "crates/zodchi-server",
    "crates/zodchi-flow",
    "crates/zodchi-flow-engine",
    "crates/zodchi-flow-code-package",
    "crates/zodchi-flow-asset-round",
    "crates/zodchi-flow-branch-review",
    "crates/zodchi-flow-design-brief",
    "crates/zodchi-flow-incident-triage",
    "crates/zodchi-flow-method-question",
    "crates/zodchi-flow-ops-script",
    "crates/zodchi-flow-research",
    "crates/zodchi-flow-rubric-probe",
    "crates/zodchi-flow-unity-check",
    "crates/zodchi-flow-workspace-audit",
    "crates/zodchi-flow-video",
    "crates/zodchi-flow-voiceover",
    "crates/zodchi-flow-youtube-publish",
    "crates/zodchi-flow-acceptance",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/Inkasor/zodchi"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.8"
ureq = { version = "3.5", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.flow-check]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
